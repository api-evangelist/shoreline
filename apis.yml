apis:
  - aid: shoreline:shoreline
    name: Shoreline
    description: >-
      The Shoreline cluster API — the backend that alarms, actions, bots, runbooks, notebooks,
      resources, files, integrations and principals are managed against. The endpoint was always
      customer-specific (the Terraform provider documents it as <CLUSTER_API_ENDPOINT>), so there
      is no single public base URL, and no OpenAPI was ever published. No endpoint is reachable
      today.
    humanURL: https://www.linkedin.com/company/shoreline-software
    baseURL: ''
    baseURLNote: >-
      Intentionally empty. The Shoreline API server URL is per-customer-cluster, documented as the
      `url` argument of the Terraform provider ("Customer-specific URL for the Shoreline API
      server"). No public host exists to record, and none may be guessed from the domain.
    tags:
      - AIOps
      - Incident Response
    properties:
