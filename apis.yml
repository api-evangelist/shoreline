aid: shoreline
name: Shoreline
description: >-
  Shoreline Software Inc. built an incident-automation platform for cloud operations, letting SRE
  and platform teams close the loop between detection and repair: an alarm defines when there is
  an issue, an action defines the command that fixes it, and a bot binds the two into an
  auto-remediation loop that runs without a human. The platform also shipped runbooks, notebooks,
  resource queries, file distribution and an Op query language, driven from a UI, a CLI, notebooks
  or Terraform. NVIDIA acquired Shoreline in July 2024 and the independent product surface has since
  been decommissioned — shoreline.io and docs.shoreline.io no longer resolve, and www.shoreline.io
  redirects in full to nvidia.com. The only first-party developer artifact still published is the
  Terraform provider, now archived.
