description: >-
  Shoreline publishes no rate limits. Its documentation host no longer resolves and there is no
  reachable API endpoint to observe response headers on, so neither the documented numbers nor the
  runtime signal can be recorded. limit_count is 0 — an honest zero.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
observed:
  note: >-
    The only rate-limit-adjacent field found in any surviving first-party artifact is
    `api_rate_limit` on the Terraform `shoreline_integration` resource, which configures the rate
    at which Shoreline calls an EXTERNAL service. It is not a limit Shoreline imposes on callers
    of its own API, and it is therefore not recorded as one.
note: >-
  REPLACED A SCAFFOLD. Until 2026-08-29 this file carried five invented limits across free /
  professional / enterprise tiers and an invented X-RateLimit-* header set, written by the
  2026-05-04 bulk sweep and marked method: generated. Shoreline never published any of it. See
  roadmap#35.
